name: 핫딜 수집

on:
  schedule:
    # 30분마다. GitHub 사정으로 몇 분~수십 분 늦거나 가끔 건너뛸 수 있어요.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write   # 수집 기록을 data 브랜치에 저장
  pages: write      # 앱을 GitHub Pages에 배포
  id-token: write

concurrency:
  group: hotdeal-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 수집 기록(글 목록·제품·가격 기록)은 main이 아니라 'data' 브랜치 하나에 덮어써서 저장소가 커지지 않게 해요.
      - name: 지난 수집 기록 가져오기
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD data | tar -x
            echo "이전 기록을 이어서 써요"
          else
            echo "첫 실행이에요"
          fi

      - name: 커뮤니티 글 수집과 쇼핑몰 가격 비교
        run: python -m collector.collect

      - name: 앱 데이터 만들기
        env:
          ALERTS_ENABLED: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        run: python -m collector.build

      - name: 텔레그램 알림 (설정했을 때만)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m collector.notify

      - name: 수집 기록 저장
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d data ] || exit 0
          rm -rf data/debug
          dir="$RUNNER_TEMP/store"; rm -rf "$dir"; mkdir -p "$dir"; cp -r data "$dir/"
          cd "$dir"
          git init -q -b data
          git add data
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "수집 기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
